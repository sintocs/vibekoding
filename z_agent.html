<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Полный курс Python</title>

<!-- CodeMirror (редактор кода) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

<!-- Иконки (Lucide) -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  :root {
    --bg: #0a0a23;
    --bg-secondary: #1b1b32;
    --bg-tertiary: #2a2a40;
    --bg-card: #1b1b32;
    --primary: #f1be32;
    --primary-dark: #d4a017;
    --accent: #99c9ff;
    --success: #6bcf7f;
    --danger: #ff6b6b;
    --warning: #ffb347;
    --text: #f5f5f7;
    --text-muted: #a9a9c2;
    --border: #3b3b55;
    --sidebar-w: 320px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Lato', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ====== Шапка ====== */
  header {
    height: 56px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 24px;
    position: relative;
    z-index: 50;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 20px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }
  .logo .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #1b1b32;
    font-weight: 900;
  }
  .logo span { color: var(--primary); }

  .header-nav {
    display: flex;
    gap: 6px;
    margin-left: 8px;
  }
  .header-nav a {
    color: var(--text-muted);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    transition: all .15s;
    cursor: pointer;
  }
  .header-nav a:hover { background: var(--bg-tertiary); color: var(--text); }
  .header-nav a.active { color: var(--primary); }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .progress-mini {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-muted);
  }
  .progress-mini-bar {
    width: 120px; height: 8px;
    background: var(--bg-tertiary);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-mini-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--primary-dark));
    width: 0%;
    transition: width .4s ease;
  }

  .btn-donate {
    background: linear-gradient(135deg, #f1be32, #ff9a3c);
    color: #1b1b32;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-donate:hover { filter: brightness(1.1); }

  /* ====== Layout ====== */
  .app {
    display: flex;
    height: calc(100vh - 56px);
  }

  /* ====== Сайдбар ====== */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    transition: transform .25s;
  }
  .sidebar::-webkit-scrollbar { width: 8px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }

  .sidebar-search {
    padding: 14px;
    position: sticky; top: 0;
    background: var(--bg-secondary);
    z-index: 5;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-search input {
    width: 100%;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px 9px 34px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  .sidebar-search { position: relative; }
  .sidebar-search .search-icon {
    position: absolute;
    left: 26px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .module { border-bottom: 1px solid var(--border); }
  .module-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    transition: background .15s;
  }
  .module-header:hover { background: var(--bg-tertiary); }
  .module-header .chevron {
    transition: transform .2s;
    color: var(--text-muted);
  }
  .module.collapsed .chevron { transform: rotate(-90deg); }
  .module-header .module-num {
    color: var(--primary);
    font-size: 12px;
    margin-right: 8px;
    font-weight: 600;
  }
  .module-lessons {
    list-style: none;
    overflow: hidden;
    max-height: 5000px;
    transition: max-height .3s ease;
  }
  .module.collapsed .module-lessons { max-height: 0; }

  .lesson-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 10px 28px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text-muted);
    border-left: 3px solid transparent;
    transition: all .15s;
  }
  .lesson-item:hover { background: var(--bg-tertiary); color: var(--text); }
  .lesson-item.active {
    background: rgba(241, 190, 50, 0.08);
    color: var(--primary);
    border-left-color: var(--primary);
  }
  .lesson-item.completed .lesson-check {
    color: var(--success);
  }
  .lesson-check {
    width: 16px; height: 16px;
    flex-shrink: 0;
  }
  .lesson-item.completed .lesson-check::before {
    content: '✓';
    color: var(--success);
    font-weight: bold;
  }
  .lesson-check { color: var(--text-muted); opacity: .5; }

  /* ====== Контент урока ====== */
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .lesson-header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .lesson-header h1 {
    font-size: 18px;
    font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  .lesson-header .lesson-badge {
    background: var(--bg-tertiary);
    color: var(--accent);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .lesson-nav-btns { display: flex; gap: 8px; }
  .lesson-nav-btns button {
    background: var(--bg-tertiary);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .lesson-nav-btns button:hover:not(:disabled) { background: var(--border); }
  .lesson-nav-btns button:disabled { opacity: .4; cursor: not-allowed; }

  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
  }

  /* Левая панель — теория */
  .panel-left {
    overflow-y: auto;
    padding: 28px 32px;
    border-right: 1px solid var(--border);
    background: var(--bg);
  }
  .panel-left::-webkit-scrollbar { width: 10px; }
  .panel-left::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  .lesson-section {
    margin-bottom: 28px;
  }
  .lesson-section h2 {
    font-size: 22px;
    margin-bottom: 12px;
    border-bottom: 2px solid var(--primary);
    padding-bottom: 6px;
    display: inline-block;
  }
  .lesson-section h3 {
    font-size: 17px;
    margin: 18px 0 8px;
    color: var(--accent);
  }
  .lesson-section p {
    margin-bottom: 12px;
    color: var(--text);
  }
  .lesson-section ul, .lesson-section ol {
    margin: 8px 0 14px 24px;
  }
  .lesson-section li { margin-bottom: 6px; }
  .lesson-section code {
    background: var(--bg-tertiary);
    color: var(--primary);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    font-size: 13.5px;
  }
  .lesson-section pre {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 12px 0;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .lesson-section pre code {
    background: transparent;
    color: var(--text);
    padding: 0;
  }
  .lesson-section .note {
    background: rgba(153, 201, 255, 0.08);
    border-left: 4px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 6px 6px 0;
    margin: 14px 0;
  }
  .lesson-section .warning {
    background: rgba(255, 179, 71, 0.08);
    border-left: 4px solid var(--warning);
    padding: 12px 16px;
    border-radius: 0 6px 6px 0;
    margin: 14px 0;
  }
  .lesson-section .task {
    background: rgba(241, 190, 50, 0.06);
    border: 1px solid rgba(241, 190, 50, 0.3);
    border-radius: 8px;
    padding: 16px 18px;
    margin: 16px 0;
  }
  .lesson-section .task h3 { color: var(--primary); margin-top: 0; }

  /* Правая панель — редактор + консоль */
  .panel-right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-secondary);
  }

  .editor-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .editor-toolbar .tabs { display: flex; gap: 4px; }
  .editor-toolbar .tab {
    padding: 5px 12px;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-muted);
    font-weight: 600;
  }
  .editor-toolbar .tab.active {
    background: var(--bg-secondary);
    color: var(--text);
  }
  .editor-actions { display: flex; gap: 8px; }
  .btn {
    border: none;
    padding: 7px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    display: flex; align-items: center; gap: 6px;
    transition: all .15s;
  }
  .btn-run {
    background: var(--success);
    color: #0a0a23;
  }
  .btn-run:hover { filter: brightness(1.1); }
  .btn-run:disabled { opacity: .5; cursor: wait; }
  .btn-test {
    background: var(--primary);
    color: #1b1b32;
  }
  .btn-test:hover { filter: brightness(1.1); }
  .btn-test:disabled { opacity: .5; cursor: wait; }
  .btn-reset {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-reset:hover { background: var(--bg-card); color: var(--text); }
  .btn-hint {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn-hint:hover { background: rgba(153, 201, 255, 0.1); }

  .editor-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  .CodeMirror {
    height: 100% !important;
    font-size: 14px;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  }

  .console-wrap {
    height: 38%;
    min-height: 140px;
    border-top: 2px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .console-header {
    padding: 6px 12px;
    background: var(--bg-tertiary);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .console-clear {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .console-clear:hover { background: var(--bg-card); color: var(--text); }
  .console-output {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.55;
    background: #0d1117;
    color: #c9d1d9;
  }
  .console-output .log-line { white-space: pre-wrap; word-break: break-word; }
  .console-output .log-error { color: #ff7b72; }
  .console-output .log-success { color: #56d364; }
  .console-output .log-info { color: #79c0ff; }
  .console-output .log-warn { color: #d29922; }
  .console-output .log-result { color: #56d364; font-weight: bold; }
  .console-output .log-test { color: var(--primary); }

  /* ====== Pyodide loader ====== */
  .loader-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 10, 35, 0.95);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999;
    gap: 20px;
  }
  .loader-overlay.hidden { display: none; }
  .loader-logo {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    color: #1b1b32;
    font-weight: 900;
    font-size: 36px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: .85; }
  }
  .loader-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .loader-subtext {
    color: var(--text-muted);
    font-size: 14px;
  }
  .loader-bar {
    width: 280px; height: 6px;
    background: var(--bg-tertiary);
    border-radius: 3px;
    overflow: hidden;
  }
  .loader-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--primary-dark));
    width: 0%;
    transition: width .3s;
  }

  /* ====== Модалка завершения ====== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center; justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; animation: fadeIn .2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px;
    max-width: 460px;
    width: 90%;
    text-align: center;
    animation: slideUp .3s;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-icon {
    width: 70px; height: 70px;
    background: linear-gradient(135deg, var(--success), #4a9d5a);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
    font-size: 36px;
    color: white;
  }
  .modal h2 { font-size: 24px; margin-bottom: 8px; }
  .modal p { color: var(--text-muted); margin-bottom: 20px; }
  .modal .modal-stats {
    display: flex; gap: 16px; justify-content: center; margin-bottom: 24px;
  }
  .modal .stat {
    background: var(--bg-tertiary);
    padding: 12px 18px;
    border-radius: 8px;
  }
  .modal .stat-num { font-size: 22px; font-weight: 800; color: var(--primary); }
  .modal .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .modal .btn-primary {
    background: var(--primary);
    color: #1b1b32;
    padding: 10px 22px;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }
  .modal .btn-secondary {
    background: var(--bg-tertiary);
    color: var(--text);
    padding: 10px 22px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }

  /* ====== Стартовая страница ====== */
  .welcome-screen {
    flex: 1;
    overflow-y: auto;
    padding: 40px 48px;
    background: var(--bg);
  }
  .welcome-hero {
    max-width: 800px;
    margin: 0 auto 40px;
    text-align: center;
  }
  .welcome-hero h1 {
    font-size: 42px;
    font-weight: 800;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #f1be32, #ff9a3c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .welcome-hero p {
    font-size: 17px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
  .welcome-hero .btn-cta {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #1b1b32;
    border: none;
    padding: 14px 32px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .welcome-hero .btn-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(241,190,50,0.3); }

  .features-grid {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
  }
  .feature-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    transition: transform .2s, border-color .2s;
  }
  .feature-card:hover { transform: translateY(-3px); border-color: var(--primary); }
  .feature-card .icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: rgba(241, 190, 50, 0.12);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .feature-card h3 { font-size: 16px; margin-bottom: 6px; }
  .feature-card p { font-size: 13px; color: var(--text-muted); }

  .modules-overview {
    max-width: 1000px;
    margin: 40px auto 0;
  }
  .modules-overview h2 {
    font-size: 24px;
    margin-bottom: 20px;
    text-align: center;
  }
  .module-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 18px;
    cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  .module-card:hover { border-color: var(--primary); transform: translateX(4px); }
  .module-card .num {
    width: 44px; height: 44px;
    background: var(--bg-tertiary);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    color: var(--primary);
    flex-shrink: 0;
  }
  .module-card .info { flex: 1; }
  .module-card .info h4 { font-size: 15px; margin-bottom: 3px; }
  .module-card .info p { font-size: 12px; color: var(--text-muted); }
  .module-card .lessons-count {
    background: var(--bg-tertiary);
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }

  /* ====== Toast ====== */
  .toast-container {
    position: fixed;
    bottom: 20px; right: 20px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .toast {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    min-width: 280px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    animation: slideInRight .3s;
  }
  @keyframes slideInRight { from { transform: translateX(120%); } to { transform: translateX(0); } }
  .toast.success { border-left: 4px solid var(--success); }
  .toast.error { border-left: 4px solid var(--danger); }
  .toast.info { border-left: 4px solid var(--accent); }
  .toast .toast-icon { flex-shrink: 0; }

function $(sel) { return document.querySelector(sel); }
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg, type = 'info') {
  const container = $('#toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success: 'check-circle', error: 'x-circle', info: 'info' };
  t.innerHTML = `<i data-lucide="${icons[type]||'info'}" class="toast-icon" width="20" height="20"></i><div class="toast-msg">${escapeHtml(msg)}</div>`;
  container.appendChild(t);
  if (window.lucide) lucide.createIcons();
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(120%)';
    t.style.transition = 'all .3s';
    setTimeout(() => t.remove(), 300);
  }, 3500);
}

function updateProgress() {
  const total = CURRICULUM.reduce((s, m) => s + m.lessons.length, 0);
  const done = completed.size;
  $('#progressText').textContent = `${done} / ${total}`;
  $('#progressFill').style.width = (total ? (done / total * 100) : 0) + '%';
}

function getAllLessonsFlat() {
  const flat = [];
  CURRICULUM.forEach(m => m.lessons.forEach(l => flat.push({ ...l, moduleId: m.id, moduleTitle: m.title })));
  return flat;
}

function findLesson(id) {
  for (const m of CURRICULUM) {
    const l = m.lessons.find(x => x.id === id);
    if (l) return { lesson: l, module: m };
  }
  return null;
}

/* ===========================================================
   SIDEBAR / CURRICULUM RENDERING
   =========================================================== */

function renderCurriculum() {
  const container = $('#curriculumList');
  container.innerHTML = '';
  CURRICULUM.forEach((module, mi) => {
    const mod = document.createElement('div');
    mod.className = 'module' + (mi === 0 ? '' : ' collapsed');
    mod.dataset.title = module.title.toLowerCase();

    const completedCount = module.lessons.filter(l => completed.has(l.id)).length;

    mod.innerHTML = `
      <div class="module-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <div>
          <span class="module-num">Модуль ${mi + 1}</span>
          ${escapeHtml(module.title)}
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400;">
            ${completedCount} / ${module.lessons.length} пройдено
          </div>
        </div>
        <i data-lucide="chevron-down" class="chevron" width="18" height="18"></i>
      </div>
      <ul class="module-lessons">
        ${module.lessons.map((l, li) => `
          <li class="lesson-item ${completed.has(l.id) ? 'completed' : ''} ${l.id === currentLessonId ? 'active' : ''}"
              data-lesson="${l.id}" data-title="${escapeHtml(l.title.toLowerCase())}"
              onclick="openLesson('${l.id}')">
            <span class="lesson-check">
              ${completed.has(l.id) ? '✓' : (li + 1)}
            </span>
            <span>${escapeHtml(l.title)}</span>
          </li>
        `).join('')}
      </ul>
    `;
    container.appendChild(mod);
  });
  if (window.lucide) lucide.createIcons();
}

function filterLessons(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('.module').forEach(mod => {
    const moduleTitle = mod.dataset.title;
    let anyVisible = false;
    mod.querySelectorAll('.lesson-item').forEach(item => {
      const title = item.dataset.title;
      const match = !q || title.includes(q) || moduleTitle.includes(q);
      item.style.display = match ? '' : 'none';
      if (match) anyVisible = true;
    });
    mod.style.display = anyVisible ? '' : 'none';
    if (q && anyVisible) mod.classList.remove('collapsed');
  });
}

/* ===========================================================
   LESSON RENDERING
   =========================================================== */

function openLesson(id) {
  const found = findLesson(id);
  if (!found) return;
  const { lesson, module } = found;
  currentLessonId = id;

  renderLessonView(lesson, module);
  renderCurriculum();

  // закрыть мобильное меню
  $('#sidebar').classList.remove('open');

  // прокрутить теорию наверх
  $('.panel-left')?.scrollTo(0, 0);
}

function renderLessonView(lesson, module) {
  const flat = getAllLessonsFlat();
  const idx = flat.findIndex(l => l.id === lesson.id);
  const prev = idx > 0 ? flat[idx - 1] : null;
  const next = idx < flat.length - 1 ? flat[idx + 1] : null;

  const html = `
    <div class="lesson-header">
      <h1>
        <span style="color:var(--text-muted);font-size:13px;font-weight:500">${escapeHtml(module.title)} ›</span>
        ${escapeHtml(lesson.title)}
        <span class="lesson-badge">Урок ${idx + 1} / ${flat.length}</span>
      </h1>
      <div class="lesson-nav-btns">
        <button onclick="openLesson('${prev ? prev.id : lesson.id}')" ${prev ? '' : 'disabled'}>
          <i data-lucide="chevron-left" width="16" height="16"></i> Назад
        </button>
        <button onclick="openLesson('${next ? next.id : lesson.id}')" ${next ? '' : 'disabled'}>
          Дальше <i data-lucide="chevron-right" width="16" height="16"></i>
        </button>
      </div>
    </div>
    <div class="workspace">
      <div class="panel-left">
        <div class="lesson-section">
          ${lesson.description}
        </div>
        <div class="lesson-section task">
          <h3>📝 Задание</h3>
          <p>${lesson.task}</p>
        </div>
        ${lesson.hint ? `<button class="btn btn-hint" onclick="showHint()"><i data-lucide="lightbulb" width="14" height="14"></i> Показать подсказку</button>` : ''}
      </div>
      <div class="panel-right">
        <div class="editor-toolbar">
          <div class="tabs">
            <div class="tab active">script.py</div>
          </div>
          <div class="editor-actions">
            <button class="btn btn-reset" onclick="resetCode()" title="Сбросить код"><i data-lucide="rotate-ccw" width="14" height="14"></i> Сброс</button>
            <button class="btn btn-run" id="runBtn" onclick="runCode()" title="Запустить (Ctrl+Enter)"><i data-lucide="play" width="14" height="14"></i> Запустить</button>
            <button class="btn btn-test" id="testBtn" onclick="runTests()" title="Проверить (Ctrl+Shift+Enter)"><i data-lucide="check-circle" width="14" height="14"></i> Проверить</button>
          </div>
        </div>
        <div class="editor-wrap">
          <textarea id="codeEditor"></textarea>
        </div>
        <div class="console-wrap">
          <div class="console-header">
            <span>Консоль</span>
            <span class="console-clear" onclick="clearConsole()">Очистить</span>
          </div>
          <div class="console-output" id="consoleOutput">
            <div class="log-line log-info"># Готово к запуску. Нажмите «Запустить».</div>
          </div>
        </div>
      </div>
    </div>
  `;

  $('#mainArea').innerHTML = html;
  if (window.lucide) lucide.createIcons();

  // Инициализация редактора
  const savedCode = localStorage.getItem('pycamp_code_' + lesson.id);
  const initialCode = savedCode !== null ? savedCode : lesson.starter;

  const ta = $('#codeEditor');
  ta.value = initialCode;
  editor = CodeMirror.fromTextArea(ta, {
    mode: 'python',
    theme: 'dracula',
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    autoCloseBrackets: true,
    matchBrackets: true,
    styleActiveLine: true,
    extraKeys: {
      'Ctrl-Enter': runCode,
      'Cmd-Enter': runCode,
      'Ctrl-Shift-Enter': runTests,
      'Cmd-Shift-Enter': runTests,
      'Tab': cm => cm.replaceSelection('    ')
    }
  });

  editor.on('change', () => {
    localStorage.setItem('pycamp_code_' + lesson.id, editor.getValue());
  });

  clearConsole();
}

function showHint() {
  const found = findLesson(currentLessonId);
  if (!found) return;
  toast('💡 Подсказка: ' + found.lesson.hint, 'info');
}

function resetCode() {
  const found = findLesson(currentLessonId);
  if (!found || !editor) return;
  if (!confirm('Сбросить код к начальному состоянию?')) return;
  editor.setValue(found.lesson.starter);
  localStorage.removeItem('pycamp_code_' + currentLessonId);
  toast('Код сброшен', 'info');
}

/* ===========================================================
   CODE EXECUTION (Pyodide)
   =========================================================== */

async function ensurePyodide() {
  if (pyodideReady) return pyodide;
  while (!pyodideReady) {
    await new Promise(r => setTimeout(r, 200));
  }
  return pyodide;
}

async function loadPyodideAsync() {
  try {
    updateLoader('Загрузка интерпретатора Python...', 30);
    pyodide = await loadPyodide();
    updateLoader('Настройка окружения...', 80);

    // Перехватываем stdout/stderr и input
    pyodide.runPython(`
import sys, io, builtins

_output_buffer = []
_input_buffer = []

class _Catcher:
    def write(self, s):
        _output_buffer.append(s)

sys.stdout = _Catcher()
sys.stderr = _Catcher()

def _custom_input(prompt=""):
    if prompt:
        _output_buffer.append(str(prompt))
    if _input_buffer:
        return _input_buffer.pop(0)
    return ""

builtins.input = _custom_input
`);

    pyodideReady = true;
    updateLoader('Готово!', 100);
    setTimeout(() => {
      $('#loader').classList.add('hidden');
    }, 400);
  } catch (e) {
    console.error('Pyodide load error:', e);
    $('#loaderSub').innerHTML = '⚠️ Ошибка загрузки Python. Проверьте интернет.<br><button onclick="location.reload()" style="margin-top:10px;padding:8px 16px;background:#f1be32;border:none;border-radius:6px;cursor:pointer;font-weight:bold;color:#1b1b32">Перезагрузить</button>';
  }
}

function updateLoader(text, percent) {
  $('#loaderSub').textContent = text;
  $('#loaderFill').style.width = percent + '%';
}

function clearConsole() {
  const out = $('#consoleOutput');
  if (out) out.innerHTML = '';
}

function logToConsole(text, cls = '') {
  const out = $('#consoleOutput');
  if (!out) return;
  const line = document.createElement('div');
  line.className = 'log-line ' + cls;
  line.textContent = text;
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
}

async function runCode() {
  if (!editor) return;
  if (!pyodideReady) {
    toast('Python ещё загружается, подождите...', 'info');
    return;
  }
  const code = editor.getValue();
  const found = findLesson(currentLessonId);
  const stdinData = found && found.lesson.stdin ? found.lesson.stdin : null;

  $('#runBtn').disabled = true;
  const oldHtml = $('#runBtn').innerHTML;
  $('#runBtn').innerHTML = '<span class="spinner"></span> Запуск...';

  clearConsole();
  logToConsole('▶ Запуск программы...', 'log-info');

  try {
    // Подготавливаем буферы
    pyodide.runPython('_output_buffer.clear()');
    if (stdinData) {
      pyodide.runPython(`_input_buffer.clear()\n_input_buffer.extend(${JSON.stringify(stdinData.split('\n'))})`);
    } else {
      pyodide.runPython('_input_buffer.clear()');
    }

    // Запуск кода
    await pyodide.runPythonAsync(code);

    // Получаем вывод
    const output = pyodide.runPython('"\\n".join(_output_buffer) if _output_buffer else ""');
    if (output) {
      logToConsole(output);
    } else {
      logToConsole('(программа не вывела ничего)', 'log-warn');
    }
  } catch (err) {
    const msg = String(err.message || err);
    logToConsole(msg, 'log-error');
  } finally {
    $('#runBtn').disabled = false;
    $('#runBtn').innerHTML = oldHtml;
    if (window.lucide) lucide.createIcons();
  }
}

async function runTests() {
  if (!editor) return;
  if (!pyodideReady) {
    toast('Python ещё загружается, подождите...', 'info');
    return;
  }
  const found = findLesson(currentLessonId);
  if (!found) return;
  const lesson = found.lesson;
  const code = editor.getValue();
  const stdinData = lesson.stdin;

  $('#testBtn').disabled = true;
  const oldHtml = $('#testBtn').innerHTML;
  $('#testBtn').innerHTML = '<span class="spinner"></span> Проверка...';

  clearConsole();
  logToConsole('🧪 Запуск тестов...', 'log-test');

  try {
    // Запуск
    pyodide.runPython('_output_buffer.clear()');
    if (stdinData) {
      pyodide.runPython(`_input_buffer.clear()\n_input_buffer.extend(${JSON.stringify(stdinData.split('\n'))})`);
    } else {
      pyodide.runPython('_input_buffer.clear()');
    }

    await pyodide.runPythonAsync(code);

    const output = pyodide.runPython('"\\n".join(_output_buffer) if _output_buffer else ""');

    // Проверка тестов
    let allPassed = true;
    let failureMsg = '';
    for (let i = 0; i < lesson.tests.length; i++) {
      const t = lesson.tests[i];
      const passed = t.check(output);
      logToConsole(`${passed ? '✓' : '✗'} Тест ${i + 1}: ${passed ? 'пройден' : t.msg}`, passed ? 'log-success' : 'log-error');
      if (!passed) {
        allPassed = false;
        failureMsg = t.msg;
      }
    }

    if (output && allPassed) {
      logToConsole('\n--- Вывод программы ---', 'log-info');
      logToConsole(output);
    }

    if (allPassed) {
      const wasNew = !completed.has(lesson.id);
      completed.add(lesson.id);
      localStorage.setItem('pycamp_completed', JSON.stringify([...completed]));
      updateProgress();
      renderCurriculum();
      logToConsole('\n🎉 Все тесты пройдены!', 'log-success');
      if (wasNew) {
        showModal(lesson);
      } else {
        toast('Все тесты пройдены!', 'success');
      }
    } else {
      logToConsole(`\n❌ Тесты не пройдены: ${failureMsg}`, 'log-error');
    }
  } catch (err) {
    const msg = String(err.message || err);
    logToConsole('❌ Ошибка выполнения:', 'log-error');
    logToConsole(msg, 'log-error');
  } finally {
    $('#testBtn').disabled = false;
    $('#testBtn').innerHTML = oldHtml;
    if (window.lucide) lucide.createIcons();
  }
}

/* ===========================================================
   MODAL
   =========================================================== */

function showModal(lesson) {
  const flat = getAllLessonsFlat();
  const total = flat.length;
  const done = completed.size;
  const percent = Math.round((done / total) * 100);
  $('#modalProgress').textContent = percent + '%';
  $('#modalXP').textContent = '+50';
  $('#modalTitle').textContent = 'Урок пройден!';

  const idx = flat.findIndex(l => l.id === lesson.id);
  const isLast = idx === flat.length - 1;
  $('#modalNext').textContent = isLast ? 'Завершить курс' : 'Следующий урок →';
  $('#modal').classList.add('show');
}

function closeModal() {
  $('#modal').classList.remove('show');
}

function nextLesson() {
  closeModal();
  const flat = getAllLessonsFlat();
  const idx = flat.findIndex(l => l.id === currentLessonId);
  if (idx >= 0 && idx < flat.length - 1) {
    openLesson(flat[idx + 1].id);
  } else {
    showWelcome();
    toast('🎉 Поздравляем! Вы прошли весь курс!', 'success');
  }
}

/* ===========================================================
   WELCOME SCREEN
   =========================================================== */

function showWelcome() {
  currentLessonId = null;
  renderCurriculum();

  const total = CURRICULUM.reduce((s, m) => s + m.lessons.length, 0);
  const done = completed.size;
  const percent = Math.round((done / total) * 100);

  let nextLesson = null;
  for (const m of CURRICULUM) {
    for (const l of m.lessons) {
      if (!completed.has(l.id)) { nextLesson = l; break; }
    }
    if (nextLesson) break;
  }

  const html = `
    <div class="welcome-screen">
      <div class="welcome-hero">
        <h1>Изучай Python бесплатно</h1>
        <p>Полный интерактивный курс по Python — от переменных до декораторов и генераторов. Пишите код прямо в браузере, выполняйте задания и отслеживайте прогресс. Никаких установок — Python работает прямо здесь.</p>
        <button class="btn-cta" onclick="openLesson('${nextLesson ? nextLesson.id : CURRICULUM[0].lessons[0].id}')">
          <i data-lucide="play" width="18" height="18"></i>
          ${done > 0 ? 'Продолжить обучение' : 'Начать курс'}
        </button>
        ${done > 0 ? `<p style="margin-top:18px;font-size:14px;color:var(--text-muted)">Ваш прогресс: ${done} / ${total} уроков (${percent}%)</p>` : ''}
      </div>

      <div class="features-grid">
        <div class="feature-card">
          <div class="icon"><i data-lucide="terminal" width="22" height="22"></i></div>
          <h3>Реальный Python</h3>
          <p>Настоящий интерпретатор Python в браузере через WebAssembly. Никаких эмуляций.</p>
        </div>
        <div class="feature-card">
          <div class="icon"><i data-lucide="book-open" width="22" height="22"></i></div>
          <h3>${total} уроков</h3>
          <p>От основ до ООП, декораторов и генераторов. Структурированный путь обучения.</p>
        </div>
        <div class="feature-card">
          <div class="icon"><i data-lucide="check-circle" width="22" height="22"></i></div>
          <h3>Автопроверка</h3>
          <p>Тесты проверяют ваш код автоматически и сразу показывают результат.</p>
        </div>
        <div class="feature-card">
          <div class="icon"><i data-lucide="trophy" width="22" height="22"></i></div>
          <h3>Прогресс и XP</h3>
          <p>Отмечайте пройденные уроки, копите опыт и отслеживайте прогресс курса.</p>
        </div>
      </div>

      <div class="modules-overview">
        <h2>Программа курса</h2>
        ${CURRICULUM.map((m, i) => {
          const doneCount = m.lessons.filter(l => completed.has(l.id)).length;
          return `
            <div class="module-card" onclick="openLesson('${m.lessons[0].id}')">
              <div class="num">${i + 1}</div>
              <div class="info">
                <h4>${escapeHtml(m.title)}</h4>
                <p>${doneCount} / ${m.lessons.length} пройдено</p>
              </div>
              <div class="lessons-count">${m.lessons.length} уроков</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
  $('#mainArea').innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

function showForum() {
  toast('Форум сообщества скоро откроется 🚧', 'info');
}
function showNews() {
  toast('Новости PyCamp: добавлен курс по Python! 🎉', 'info');
}
function showDonate() {
  toast('Спасибо за желание поддержать проект! ❤️', 'success');
}

/* ===========================================================
   INIT
   =========================================================== */

window.addEventListener('DOMContentLoaded', () => {
  if (window.lucide) lucide.createIcons();
  renderCurriculum();
  updateProgress();
  showWelcome();
  loadPyodideAsync();

  // Мобильное меню
  $('#menuToggle').addEventListener('click', () => {
    $('#sidebar').classList.toggle('open');
  });

  // Клик вне сайдбара закрывает его на мобильных
  document.addEventListener('click', (e) => {
    if (window.innerWidth <= 900) {
      const sb = $('#sidebar');
      const toggle = $('#menuToggle');
      if (sb.classList.contains('open') && !sb.contains(e.target) && !toggle.contains(e.target)) {
        sb.classList.remove('open');
      }
    }
  });
});
</script>
