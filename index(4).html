<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sintocs — навигация</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  header h1 span { color: #58a6ff; }

  header p {
    margin-top: 8px;
    color: #8b949e;
    font-size: 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 820px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: #58a6ff;
    background: #1c2128;
  }

  .avatar {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
  }

  .card .info { min-width: 0; }

  .card .name {
    font-size: 16px;
    font-weight: 600;
    color: #58a6ff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card .file {
    margin-top: 3px;
    font-size: 13px;
    color: #8b949e;
    font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  footer {
    margin-top: 48px;
    color: #8b949e;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1><span>sintocs</span> · навигация</h1>
  <p>Выберите раздел для перехода</p>
</header>

<nav class="grid">
  <a class="card" href="codex.html">
    <div class="avatar" style="background:#1f6feb">C</div>
    <div class="info">
      <div class="name">Codex</div>
      <div class="file">codex.html</div>
    </div>
  </a>

  <a class="card" href="cursor.html">
    <div class="avatar" style="background:#8957e5">C</div>
    <div class="info">
      <div class="name">Cursor</div>
      <div class="file">cursor.html</div>
    </div>
  </a>

  <a class="card" href="olama.html">
    <div class="avatar" style="background:#238636">O</div>
    <div class="info">
      <div class="name">Ollama</div>
      <div class="file">olama.html</div>
    </div>
  </a>

  <a class="card" href="qwen.html">
    <div class="avatar" style="background:#bf3989">Q</div>
    <div class="info">
      <div class="name">Qwen</div>
      <div class="file">qwen.html</div>
    </div>
  </a>

  <a class="card" href="qwen1.html">
    <div class="avatar" style="background:#d29922">Q</div>
    <div class="info">
      <div class="name">Qwen 1</div>
      <div class="file">qwen1.html</div>
    </div>
  </a>

  <a class="card" href="z_agent.html">
    <div class="avatar" style="background:#db6d28">Z</div>
    <div class="info">
      <div class="name">Z Agent</div>
      <div class="file">z_agent.html</div>
    </div>
  </a>
</nav>

<footer>sintocs &middot; 2026</footer>

</body>
</html>
